services:
  - type: web
    name: ruwad-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    # --include=dev is required here: Render skips devDependencies during
    # install whenever NODE_ENV=production is set (below) — even though
    # that var is meant for the running app, not the build step, Render
    # applies it there too. `nest build` (nest CLI) and `migration:run`
    # (ts-node/typescript) both need devDependencies, so a plain
    # `npm install` here fails with "nest: not found".
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run deploy:start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Database is Supabase Postgres, not a Render-provisioned instance.
      # `sync: false` means Render will NOT read a value from this file or
      # from git — it must be set once in the Render dashboard (Environment
      # tab) after the first deploy. Paste the Supabase connection string
      # from: Supabase Dashboard -> Project Settings -> Database ->
      # Connection string -> URI. Never put the real value here.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # Optional — only needed for the signup wizard's resume-autofill
      # endpoint. Same sync:false pattern as DATABASE_URL: set manually in
      # the Render dashboard from https://console.anthropic.com if you want
      # that feature enabled in production; the rest of the app works fine
      # without it.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PORT
        value: "4000"
      # Set this to the deployed frontend's real origin (comma-separated if
      # more than one) once you know it — Render assigns ruwad-frontend's
      # URL only after its first deploy, so this can't be filled in ahead
      # of time from this file. Update it here (or directly in the Render
      # dashboard) and redeploy once you have the real onrender.com URL.
      - key: FRONTEND_URL
        value: https://ruwad-frontend.onrender.com

  - type: web
    name: ruwad-frontend
    runtime: node
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # The backend's real Render URL, known from its own first deploy.
      # Baked in at build time (NEXT_PUBLIC_* vars are inlined into the
      # client bundle) — changing this requires a redeploy, not just a
      # restart.
      - key: NEXT_PUBLIC_API_URL
        value: https://ruwad-backend-e92x.onrender.com/api
