services:
  - type: web
    name: ruwad-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    # --include=dev is required here: Render skips devDependencies during
    # install whenever NODE_ENV=production is set (below) — even though
    # that var is meant for the running app, not the build step, Render
    # applies it there too. `nest build` (nest CLI) and `migration:run`
    # (ts-node/typescript) both need devDependencies, so a plain
    # `npm install` here fails with "nest: not found".
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run deploy:start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Database is Supabase Postgres, not a Render-provisioned instance.
      # `sync: false` means Render will NOT read a value from this file or
      # from git — it must be set once in the Render dashboard (Environment
      # tab) after the first deploy. Paste the Supabase connection string
      # from: Supabase Dashboard -> Project Settings -> Database ->
      # Connection string -> URI. Never put the real value here.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # Optional — only needed for the signup wizard's resume-autofill
      # endpoint. Same sync:false pattern as DATABASE_URL: set manually in
      # the Render dashboard from https://console.anthropic.com if you want
      # that feature enabled in production; the rest of the app works fine
      # without it.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Automatic healthcare news & events (Serper.dev). BACKEND ONLY — set in
      # the Render dashboard, never in the frontend service. Without the key
      # the app keeps serving whatever was collected before. The token is the
      # shared secret for POST /api/content-refresh/{news|events|all} if you
      # drive refreshes from an external scheduler instead of the built-in
      # 6h/12h timer (see backend/scripts/ops/content-refresh.js).
      - key: SERPER_API_KEY
        sync: false
      - key: CONTENT_REFRESH_TOKEN
        sync: false
      # Google Calendar direct-add (OAuth). BACKEND ONLY; set in the dashboard.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: PORT
        value: "4000"
      # The frontend is hosted on Vercel (not on Render). FRONTEND_URL is the CORS allowlist for the browser app (comma-separated if you add
      # more origins, e.g. a custom domain); the first entry is also where Google Calendar OAuth redirects. APP_URL is the base for links in
      # emails (admin approval, report review, ...). Both must be the production Vercel address.
      - key: FRONTEND_URL
        value: https://ruwad-platform.vercel.app
      - key: APP_URL
        value: https://ruwad-platform.vercel.app
      # ---- EXPERIMENTAL ML estimate (see docs/ml-experimental-inference.md) ----
      # Never part of the RUWAD Score (ML_WEIGHT stays 0). Off until ML_EXPERIMENTAL_INFERENCE_ENABLED is set to exactly "true".
      # ML_SCORING_ENABLED (the shadow-prediction seam) is deliberately NOT set here, so it stays off.
      #
      # ML_EXPERIMENTAL_INFERENCE_ENABLED and ML_SCORING_SERVICE_URL are `sync: false` on purpose: they are operational switches owned
      # by the dashboard, so a Blueprint sync can never re-enable inference or overwrite the URL. Set ML_SCORING_SERVICE_URL to the
      # ruwad-ml service's own https://....onrender.com URL (no trailing slash). ROLLBACK: set ML_EXPERIMENTAL_INFERENCE_ENABLED to
      # false (or delete it) — founders keep their RUWAD Score; no database change is needed.
      - key: ML_EXPERIMENTAL_INFERENCE_ENABLED
        sync: false
      - key: ML_SCORING_SERVICE_URL
        sync: false
      # Shared secret, generated once on ruwad-ml and referenced here, so it is never in git and never typed by hand.
      - key: ML_SERVICE_TOKEN
        fromService:
          type: web
          name: ruwad-ml
          envVarKey: ML_SERVICE_TOKEN
      # The ONE model to use: an explicit human choice (manual experimental configuration; there is no statistical winner).
      - key: ML_EXPERIMENTAL_MODEL_VERSION
        value: exp-raisedNewRoundWithin6Months-6m-catboost-20261004070745
      - key: ML_SCORING_TIMEOUT_MS
        value: "3000"

  # Inference-only ML service. No training or admin routes. Serves exactly the model named by ML_EXPERIMENTAL_MODEL_VERSION, and only after
  # its files match ml/model_manifest.json byte for byte (see ml/app/inference/integrity.py); /health is 503 until that holds.
  # Every prediction route needs the bearer ML_SERVICE_TOKEN.
  - type: web
    name: ruwad-ml
    runtime: python
    plan: free
    region: oregon
    rootDir: ml
    buildCommand: pip install -r requirements-inference.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Pinned: the model's joblib/scikit-learn/CatBoost artifacts are version-sensitive.
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: ARTIFACT_DIR
        value: model_artifacts
      - key: REQUIRE_VERIFIED_ARTIFACTS
        value: "true"
      - key: ML_EXPERIMENTAL_MODEL_VERSION
        value: exp-raisedNewRoundWithin6Months-6m-catboost-20261004070745
      # Generated by Render at provision time; never committed. ruwad-backend reads the same value via fromService above.
      - key: ML_SERVICE_TOKEN
        generateValue: true
